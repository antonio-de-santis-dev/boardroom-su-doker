<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2 class="login-title">Bentornato</h2>
      <p class="login-subtitle">Accedi per gestire le tue prenotazioni</p>
    </div>

    @if (authenticationError()) {
      <div class="alert alert-danger">Username o password errati.</div>
    }

    <form (ngSubmit)="login()" [formGroup]="loginForm" class="login-form">
      <div class="input-group">
        <label class="field-label">USERNAME</label>
        <input #username type="text" class="figma-input" placeholder="Il tuo username" formControlName="username" />
      </div>

      <div class="input-group password-group">
        <div class="password-label-row">
          <label class="field-label">PASSWORD</label>
          <a routerLink="/account/reset/request" class="green-link forgot-link">Password dimenticata?</a>
        </div>
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" class="figma-input" placeholder="••••••••" formControlName="password" />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="figma-btn" [disabled]="isLoading">
        <span class="btn-text">{{ isLoading ? 'Accesso in corso...' : 'Accedi' }}</span>
      </button>
    </form>

    <div class="figma-footer">
      <span class="small-text">Non hai un account?</span>
      <a routerLink="/account/register" class="green-link"><strong>Registrati</strong></a>
    </div>
  </div>
</div>
