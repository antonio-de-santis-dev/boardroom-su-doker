<div class="booking-container">
  <div class="header-section">
    <h2 class="title-green">Prenota sala</h2>
    <p class="subtitle">Compila i campi per inviare la richiesta</p>
  </div>

  <div class="search-bar-card">
    <div class="field-row">
      <div class="field-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <div class="input-group-custom">
        <label for="data">DATA</label>
        <input id="data" type="date" class="form-control-br" [(ngModel)]="dataSelezionata" />
      </div>
    </div>

    <div class="field-row">
      <div class="field-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      <div class="input-group-custom">
        <label for="ora">ORA</label>
        <div class="select-wrapper">
          <select id="ora" class="form-control-br" [(ngModel)]="oraSelezionata">
            <option value="" disabled selected>Seleziona fascia oraria</option>
            @for (ora of orari; track ora) {
              <option [value]="ora">{{ ora }}</option>
            }
          </select>
          <span class="select-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <div class="field-row">
      <div class="field-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <div class="input-group-custom range-group">
        <label>CAPIENZA</label>
        <div class="range-values">
          <span>{{ capienza }}</span>
          <span class="range-max">max 100</span>
        </div>
        <input id="capienza" type="range" min="0" max="100" class="form-range-br" [(ngModel)]="capienza" />
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-annulla" (click)="router.navigate(['/'])">Annulla</button>
      <button class="btn-conferma-br" [disabled]="caricamento" (click)="confermaPrenotazione()">Conferma</button>
    </div>
  </div>
</div>
