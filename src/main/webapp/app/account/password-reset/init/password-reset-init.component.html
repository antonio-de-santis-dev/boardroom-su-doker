@if (isLoading()) {
  <div class="global-loader-overlay">
    <div class="spinner-boardroom"></div>
  </div>
}

<div class="password-reset-wrapper">
  <div class="reset-card">
    <h1>Password</h1>

    @if (!success()) {
      <div class="info-note">
        <p>Inserisci la tua email per ricevere il link di ripristino.</p>
      </div>

      <form name="form" (ngSubmit)="requestReset()" [formGroup]="resetRequestForm" class="register-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            class="form-control figma-input"
            id="email"
            name="email"
            placeholder="Esempio: nome@email.it"
            formControlName="email"
            #email
          />
        </div>

        <button type="submit" [disabled]="resetRequestForm.invalid || isLoading()" class="figma-btn">Invia link</button>
      </form>
    } @else {
      <div class="alert alert-success">
        <span>Email inviata! Controlla la tua posta in arrivo.</span>
      </div>
    }

    <div class="login-footer">
      <a routerLink="/login" class="login-link">Torna al login</a>
    </div>
  </div>
</div>
